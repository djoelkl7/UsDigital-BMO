name: Build and Package UsDigital-BMO Production

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-package:
    name: Install, Verify, Build & Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run TypeScript type check (lint)
        run: npm run lint

      - name: Build production frontend bundle
        env:
          VITE_APP_ENV: production
          VITE_APP_NAME: UsDigital-BMO
          VITE_APP_URL: http://bbmoglobal.online/
          VITE_APP_DOMAIN: bbmoglobal.online
        run: npm run build:cpanel

      - name: Verify production build output
        run: |
          test -f dist/index.html
          test -d dist/assets
          test -f server.ts
          test -f serverData.ts
          test -f app.mjs
          test -d src/assets/images

      - name: Verify cPanel/Hostinger Node.js deployment package
        run: |
          test -f UsDigital-BMO-CPANEL-PRODUCTION.zip
          unzip -t UsDigital-BMO-CPANEL-PRODUCTION.zip

      - name: Upload cPanel/Hostinger deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: UsDigital-BMO-CPANEL-PRODUCTION
          path: UsDigital-BMO-CPANEL-PRODUCTION.zip
          retention-days: 30
          if-no-files-found: error
