name: Build and Package UsDigital-BMU Production

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-package:
    name: Install, Verify, Build & Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (clean lockfile install)
        run: npm ci

      - name: Run TypeScript type check (lint)
        run: npm run lint

      - name: Build production frontend bundle
        env:
          VITE_APP_ENV: production
          VITE_APP_NAME: UsDigital-BMU
        run: npm run build

      - name: Verify production build output
        run: |
          test -f dist/index.html
          test -d dist/assets
          test -f server.ts
          test -f serverData.ts
          test -f app.mjs
          test -d src/assets/images

      - name: Prepare clean cPanel/Hostinger Node.js deployment package
        run: |
          rm -rf deploy-package UsDigital-BMO-CPANEL-PRODUCTION.zip
          mkdir -p deploy-package/src/assets
          cp -r dist deploy-package/dist
          cp -r src/assets/images deploy-package/src/assets/images
          cp server.ts serverData.ts types.ts app.mjs package.json package-lock.json .env.example DEPLOYMENT-README.txt deploy-package/
          cp deploy/.htaccess deploy-package/.htaccess
          (cd deploy-package && zip -r ../UsDigital-BMO-CPANEL-PRODUCTION.zip . -x "*.DS_Store")
          unzip -t UsDigital-BMO-CPANEL-PRODUCTION.zip

      - name: Upload cPanel/Hostinger deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: UsDigital-BMO-CPANEL-PRODUCTION
          path: UsDigital-BMO-CPANEL-PRODUCTION.zip
          retention-days: 30
          if-no-files-found: error
